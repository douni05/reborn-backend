spring:
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp.use_jdbc_metadata_defaults: false
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}

server:
  port: 8080
  tomcat:
    max-swallow-size: -1

spring.servlet:
  multipart:
    max-file-size: 20MB
    max-request-size: 20MB

springdoc:
  default-consume-media-type: application/json
  default-produce-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

firebase:
  config:
    path: reborn-2c50e-firebase-adminsdk-fbsvc-bf05103003.json
